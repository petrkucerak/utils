<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Code Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
      }
      #videoContainer {
        position: relative;
      }
      #video {
        width: 100%;
        max-width: 500px;
        border: 1px solid #ccc;
      }
      #output {
        margin-top: 20px;
        padding: 10px;
        border: 1px solid #ccc;
        min-height: 50px;
        width: 300px;
        word-wrap: break-word;
      }
      #capturedCodes {
        margin-top: 20px;
        width: 300px;
        padding: 10px;
        border: 1px solid #ccc;
      }
      #resetButton {
        margin-top: 10px;
        padding: 10px 20px;
        background-color: #f44336;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 5px;
      }
      #resetButton:hover {
        background-color: #d32f2f;
      }
    </style>
  </head>
  <body>
    <h1>QR Code Scanner</h1>
    <div id="videoContainer">
      <video id="video" autoplay playsinline></video>
    </div>
    <div id="output">Point your camera at a QR code</div>
    <button id="resetButton">Reset and Scan New QR Code</button>
    <div id="capturedCodes">
      <h3>Captured QR Codes:</h3>
      <ul id="codeList"></ul>
    </div>

    <script>
      const video = document.getElementById("video");
      const output = document.getElementById("output");
      const codeList = document.getElementById("codeList");
      const resetButton = document.getElementById("resetButton");
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      let capturedCodes = [];
      let isScanning = true;

      async function startCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" },
          });
          video.srcObject = stream;
          video.onloadedmetadata = () => {
            video.play();
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            if (isScanning) {
              scanQRCode();
            }
          };
        } catch (error) {
          output.textContent = "Error accessing camera: " + error.message;
        }
      }

      function scanQRCode() {
        if (!isScanning) return;
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = jsQR(imageData.data, imageData.width, imageData.height);
          if (code && !capturedCodes.includes(code.data)) {
            capturedCodes.push(code.data);
            output.textContent = code.data;
            updateCodeList();
            isScanning = false; // Stop scanning after capturing a code
          } else {
            output.textContent = code ? code.data : "No QR code detected";
          }
        }
        requestAnimationFrame(scanQRCode);
      }

      function updateCodeList() {
        codeList.innerHTML = "";
        capturedCodes.forEach((code, index) => {
          const li = document.createElement("li");
          li.textContent = `${index + 1}. ${code}`;
          codeList.appendChild(li);
        });
      }

      resetButton.addEventListener("click", () => {
        output.textContent = "Point your camera at a QR code";
        isScanning = true;
        scanQRCode();
      });

      startCamera();
    </script>
  </body>
</html>
