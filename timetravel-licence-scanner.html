<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timetravel ID Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
      }
      #videoContainer {
        position: relative;
      }
      #video {
        width: 90vw;
        max-width: 1000px;
        border: 1px solid #ccc;
      }
      #output {
        margin-top: 20px;
        padding: 10px;
        border: 1px solid #ccc;
        min-height: 50px;
        width: 300px;
        word-wrap: break-word;
      }
      #resetButton {
        margin-top: 10px;
        padding: 10px 20px;
        background-color: #f44336;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 5px;
      }
      #resetButton:hover {
        background-color: #d32f2f;
      }
    </style>
  </head>
  <body>
    <h1>Timetravel ID Scanner</h1>
    <div id="videoContainer">
      <video id="video" autoplay playsinline></video>
    </div>
    <div id="output">Point your camera at a QR code</div>
    <button id="resetButton">Reset and Scan New QR Code</button>

    <script>
      const video = document.getElementById("video");
      const output = document.getElementById("output");
      const resetButton = document.getElementById("resetButton");
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      let capturedCodes = [];
      let isScanning = true;

      async function startCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" },
          });
          video.srcObject = stream;
          video.onloadedmetadata = () => {
            video.play();
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            if (isScanning) {
              scanQRCode();
            }
          };
        } catch (error) {
          output.textContent = "Error accessing camera: " + error.message;
        }
      }

      function parseQRData(base64Data) {
        const parts = base64Data.split(" | ");
        // Decode Base64
        const decodedData = new TextDecoder("utf-8").decode(
          Uint8Array.from(atob(parts[1]), (c) => c.charCodeAt(0))
        );
        // Expected format: "random | [name;id]"
        //  if (parts.length !== 2) throw new Error("Invalid QR code format");
        //  const innerData = parts[1].match(/\[([^;]+);([^\]]+)\]/);
        //  if (!innerData) throw new Error("Invalid data structure");
        return { name: parts[0], id: decodedData };
      }

      function scanQRCode() {
        if (!isScanning) return;
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = jsQR(imageData.data, imageData.width, imageData.height);
          if (code) {
            // capturedCodes.push(code.data);
            const parsed = parseQRData(code.data);

            output.textContent = `${parsed.id}`;

            isScanning = false; // Stop scanning after capturing a code
          } else {
            output.textContent = "No QR code detected";
          }
        }
        requestAnimationFrame(scanQRCode);
      }

      resetButton.addEventListener("click", () => {
        output.textContent = "Point your camera at a QR code";
        isScanning = true;
        scanQRCode();
      });

      startCamera();
    </script>
  </body>
</html>
